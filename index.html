<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Choisir la voix de Léa — SecretarIA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #2b2461 0%, #0f0d24 60%, #08071a 100%);
    color: #fff; padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px; text-align: center;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    border-radius: 24px; padding: 38px 30px; backdrop-filter: blur(8px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .brand { font-weight: 800; letter-spacing: .5px; color: #a89df0; font-size: 14px; text-transform: uppercase; }
  h1 { font-size: 26px; margin: 12px 0 6px; }
  .sub { color: #b9b6d6; font-size: 14.5px; line-height: 1.5; margin-bottom: 24px; }
  .voices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .voice {
    border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 16px 10px; cursor: pointer;
    background: rgba(255,255,255,.05); color: #fff; font-size: 16px; font-weight: 700;
    transition: transform .1s ease, filter .15s ease, border-color .15s ease;
  }
  .voice small { display:block; font-weight:500; color:#b9b6d6; font-size:12px; margin-top:3px; }
  .voice:hover { filter: brightness(1.12); border-color: #8b5cf6; }
  .voice:active { transform: scale(.97); }
  .voice.playing { background: linear-gradient(135deg, #6d63e6, #8b5cf6); border-color: transparent; }
  #hangup {
    display:none; width:100%; margin-top:16px; min-height:52px; border:none; border-radius:14px; cursor:pointer;
    font-size:17px; font-weight:700; color:#fff; background: linear-gradient(135deg, #e0556b, #c8384f);
  }
  .status { margin-top: 20px; min-height: 24px; font-size: 15.5px; font-weight: 600; color: #cfe8d4; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#57d38c; margin-right:8px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .hint { margin-top: 22px; font-size: 12px; color: #7c7aa0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">SecretarIA</div>
    <h1>Choisissez la voix de Léa 🎙️</h1>
    <p class="sub">Cliquez une voix, autorisez le micro, et parlez-lui. Comparez et gardez la plus naturelle.</p>
    <div class="voices">
      <button class="voice" data-id="lvQdCgwZfBuOzxyV5pxu" data-name="Audia">Audia<small>actuelle · posée</small></button>
      <button class="voice" data-id="NEjemlRxgWmL5ZGJetsB" data-name="Claire">Claire<small>conversationnelle</small></button>
      <button class="voice" data-id="Crnn8UaAugljbB6XhAKo" data-name="Emi">Emi<small>jeune · naturelle</small></button>
      <button class="voice" data-id="vUH2A53pJe77Jd2xNGHv" data-name="Shana">Shana<small>pro · chaleureuse</small></button>
    </div>
    <button id="hangup">🔴 Raccrocher</button>
    <div class="status" id="status"></div>
    <div class="hint">Test gratuit · aucun appel téléphonique · tout se passe dans ce navigateur</div>
  </div>

<script type="module">
  import Vapi from "https://esm.sh/@vapi-ai/web@2";

  const PUBLIC_KEY = "4848b3a3-80ff-49b0-a24c-967913248c7b";
  const ASSISTANT_ID = "ed0e9cc7-945e-4449-b577-3ed1d7ae008f";

  const vapi = new Vapi(PUBLIC_KEY);
  const status = document.getElementById("status");
  const hangup = document.getElementById("hangup");
  const buttons = document.querySelectorAll(".voice");
  let active = false;
  let pending = null;

  const setStatus = (html) => { status.innerHTML = html; };
  const clearPlaying = () => buttons.forEach(b => b.classList.remove("playing"));

  function startVoice(btn) {
    const id = btn.dataset.id, name = btn.dataset.name;
    clearPlaying(); btn.classList.add("playing");
    setStatus("Connexion à la voix " + name + "…");
    // Réglages NATIFS ElevenLabs : on ne force rien (pas de style/stability custom),
    // la voix sonne comme sur le site ElevenLabs.
    vapi.start(ASSISTANT_ID, {
      voice: { provider: "11labs", voiceId: id, model: "eleven_multilingual_v2" }
    }).catch(e => { console.error(e); setStatus("Erreur : " + (e?.message || "réessayez")); clearPlaying(); });
  }

  buttons.forEach(btn => btn.addEventListener("click", () => {
    if (active) { pending = btn; vapi.stop(); }   // raccroche puis relance sur call-end
    else startVoice(btn);
  }));

  hangup.addEventListener("click", () => { pending = null; vapi.stop(); });

  vapi.on("call-start", () => { active = true; hangup.style.display = "block"; setStatus('<span class="dot"></span>En ligne — parlez à Léa !'); });
  vapi.on("call-end", () => {
    active = false; hangup.style.display = "none"; clearPlaying();
    if (pending) { const b = pending; pending = null; setTimeout(() => startVoice(b), 400); }
    else setStatus("Terminé. Essayez une autre voix pour comparer.");
  });
  vapi.on("speech-start", () => setStatus('<span class="dot"></span>🎙️ Léa parle…'));
  vapi.on("speech-end", () => setStatus('<span class="dot"></span>À vous…'));
  vapi.on("error", (e) => {
    console.error(e); active = false; hangup.style.display = "none"; clearPlaying();
    setStatus("Souci micro/connexion : " + (e?.errorMsg || e?.error?.message || e?.message || "réessayez"));
  });
</script>
</body>
</html>
